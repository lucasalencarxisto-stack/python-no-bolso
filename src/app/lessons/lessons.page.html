<ion-content [fullscreen]="true">
  <main class="lessons-container">

    <header class="lessons-header">
      <button
        type="button"
        class="back-button"
        routerLink="/home"
      >
        ←
      </button>

      <div>
        <span class="badge">TRILHA DE APRENDIZADO</span>
        <h1>Aprenda Python</h1>
        <p>Comece do básico e avance no seu ritmo.</p>
      </div>
    </header>

    <section class="lesson-list">

      @for (lesson of lessons; track lesson.id) {

        <button
          type="button"
          class="lesson-card"
          [routerLink]="['/lessons', lesson.id]"
        >
          <span class="lesson-icon">
            {{ lesson.icon }}
          </span>

          <div>
            <small>{{ lesson.number }}</small>
            <strong>{{ lesson.title }}</strong>
            <p>{{ lesson.description }}</p>
          </div>

          <span class="arrow">→</span>
        </button>

      }

    </section>

  </main>
</ion-content>
