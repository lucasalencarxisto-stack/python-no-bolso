<ion-content [fullscreen]="true">

  <main class="lessons-container">

    <header class="lessons-header">

      <button
        type="button"
        class="back-button"
        routerLink="/home"
        aria-label="Voltar para o menu inicial"
      >
        ←
      </button>


      <div>

        <span class="badge">
          TRILHA DE APRENDIZADO
        </span>

        <h1>
          Aprenda Python
        </h1>

        <p>
          Comece do básico e avance no seu ritmo.
        </p>

      </div>

    </header>


    <section class="lesson-list">

      @for (lesson of lessons; track lesson.id) {

        @if (isLessonUnlocked(lesson)) {

          <!-- Aula liberada -->
          <button
            type="button"
            class="lesson-card"
            [class.completed]="isLessonCompleted(lesson)"
            [routerLink]="['/lessons', lesson.id]"
          >

            <span class="lesson-icon">
              {{ lesson.icon }}
            </span>


            <div class="lesson-info">

              <small>
                {{ lesson.number }}
              </small>

              <strong>
                {{ lesson.title }}
              </strong>

              <p>
                {{ lesson.description }}
              </p>

            </div>


            @if (isLessonCompleted(lesson)) {

              <span
                class="lesson-state completed-state"
                aria-label="Aula concluída"
              >
                ✅
              </span>

            } @else {

              <span class="arrow">
                →
              </span>

            }

          </button>

        } @else {

          <!-- Aula bloqueada -->
          <button
            type="button"
            class="lesson-card locked"
            disabled
            aria-label="Aula bloqueada"
          >

            <span class="lesson-icon locked-icon">
              {{ lesson.icon }}
            </span>


            <div class="lesson-info">

              <small>
                {{ lesson.number }}
              </small>

              <strong>
                {{ lesson.title }}
              </strong>

              <p>
                Complete a aula anterior para desbloquear.
              </p>

            </div>


            <span
              class="lesson-state lock-state"
              aria-hidden="true"
            >
              🔒
            </span>

          </button>

        }

      }

    </section>

  </main>

</ion-content>
