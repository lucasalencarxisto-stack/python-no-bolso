<ion-content [fullscreen]="true">
  <main class="home-container">

    <section class="hero">
      <div class="logo">🐍</div>

      <span class="badge">PYTHON NO BOLSO</span>

      <h1>Aprenda programação direto no seu celular</h1>

      <p>
        Descubra os fundamentos do Python de forma simples,
        visual e interativa.
      </p>
    </section>

    <section class="menu">

      <button
        type="button"
        class="menu-card primary"
        routerLink="/lessons"
      >
        <span class="icon">🖥️</span>

        <div class="feature-card">
          <h2>Começar a aprender</h2>
          <p>Aprenda Python passo a passo</p>
        </div>

        <span class="arrow">→</span>
      </button>

     <button
  type="button"
  class="menu-card"
  [class.locked]="
    !progress.isCourseCompleted()
  "
  (click)="openQuiz()"
>

  <span class="icon">
    🧠
  </span>


  <div>

    <strong>
      Testar conhecimentos
    </strong>

    @if (
      progress.isCourseCompleted()
    ) {

      <small>
        Teste tudo o que você aprendeu
      </small>

    } @else {

      <small>
        Complete as aulas para desbloquear
      </small>

    }

  </div>


  @if (
    progress.isCourseCompleted()
  ) {

    <span class="arrow">
      →
    </span>

  } @else {

    <span>
      🔒
    </span>

  }

</button>

      <button type="button" class="menu-card" routerLink="/lessons/1">
        <span class="icon">🧪</span>

        <div>
          <strong>Laboratório</strong>
          <small>Experimente exemplos de código</small>
        </div>

        <span class="arrow">→</span>
      </button>

      <button type="button" class="menu-card" routerLink="/lessons">
        <span class="icon">📚</span>

        <div>
          <strong>Continue aprendendo</strong>
          <small>Ferramentas para praticar no celular</small>
        </div>

        <span class="arrow">→</span>
      </button>

    </section>

    <footer>
      Projeto de extensão universitária
    </footer>

    @if (quizMessageVisible) {

  <div class="locked-message">

    <span>
      🔒
    </span>

    <div>

      <strong>
        Quiz bloqueado
      </strong>

      <p>
        Para desbloquear o Quiz,
        você deve primeiro finalizar as aulas.
      </p>

    </div>

  </div>

}

  </main>
</ion-content>
