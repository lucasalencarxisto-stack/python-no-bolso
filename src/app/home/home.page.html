<ion-content [fullscreen]="true">

  <main class="home-container">

    <!-- Hero -->
    <section class="hero">

      <div class="logo">
        🐍
      </div>

      <span class="badge">
        PYTHON NO BOLSO
      </span>

      <h1>
        Aprenda programação direto no seu celular
      </h1>

      <p>
        Descubra os fundamentos do Python de forma simples,
        visual e interativa.
      </p>

    </section>


    <!-- Menu principal -->
    <section class="menu">

      <!-- Aulas -->
      <button type="button" class="menu-card primary" routerLink="/lessons">

        <span class="icon">
          🖥️
        </span>

        <div class="feature-card">

          <h2>
            Começar a aprender
          </h2>

          <p>
            Aprenda Python passo a passo
          </p>

        </div>

        <span class="arrow">
          →
        </span>

      </button>


      <!-- Quiz -->
      <button type="button" class="menu-card" [class.locked]="
          !progress.isCourseCompleted()
        " (click)="openQuiz()">

        <span class="icon">
          🧠
        </span>

        <div>

          <strong>
            Testar conhecimentos
          </strong>

          @if (
          progress.isCourseCompleted()
          ) {

          <small>
            Teste tudo o que você aprendeu
          </small>

          } @else {

          <small>
            Complete as aulas para desbloquear
          </small>

          }

        </div>


        @if (
        progress.isCourseCompleted()
        ) {

        <span class="arrow">
          →
        </span>

        } @else {

        <span>
          🔒
        </span>

        }

      </button>


      <!-- Laboratório -->
      <button type="button" class="menu-card" routerLink="/lab">

        <span class="icon">
          🧪
        </span>

        <div>

          <strong>
            Laboratório
          </strong>

          <small>
            Experimente e execute códigos Python livremente
          </small>

        </div>

        <span class="arrow">
          →
        </span>

      </button>


      <!-- Continue aprendendo -->
      <button type="button" class="menu-card">

        <span class="icon">
          📚
        </span>

        <div>

          <strong>
            Continue aprendendo
          </strong>

          <small>
            Ferramentas e conteúdos para continuar praticando
          </small>

        </div>

        <span class="arrow">
          →
        </span>

      </button>

    </section>


    <!-- Aviso de Quiz bloqueado -->
    @if (quizMessageVisible) {

    <div class="locked-message">

      <span>
        🔒
      </span>

      <div>

        <strong>
          Quiz bloqueado
        </strong>

        <p>
          Para desbloquear o Quiz,
          você deve primeiro finalizar as aulas.
        </p>

      </div>

    </div>

    }


    <footer>
      Projeto de extensão universitária
    </footer>

  </main>

</ion-content>
