<ion-content [fullscreen]="true">

  <main class="complete-container">

    <section class="celebration">

      <div class="trophy">
        🏆
      </div>

      <span class="badge">
        CURSO CONCLUÍDO
      </span>

      <h1>
        Parabéns!
      </h1>

      <p>
        Você concluiu sua primeira trilha
        de aprendizado em Python.
      </p>

    </section>


    <section class="unlock-card">

      <span class="unlock-icon">
        🧠
      </span>

      <div>

        <small>
          NOVO CONTEÚDO DESBLOQUEADO
        </small>

        <h2>
          Quiz de Python
        </h2>

        <p>
          Agora você pode testar tudo o que
          aprendeu durante as seis aulas.
        </p>

      </div>

    </section>


    <button
      type="button"
      class="quiz-button"
      routerLink="/quiz"
    >
      🧠 Começar Quiz →
    </button>


    <button
      type="button"
      class="home-button"
      routerLink="/home"
    >
      Voltar ao menu
    </button>

  </main>

</ion-content>
